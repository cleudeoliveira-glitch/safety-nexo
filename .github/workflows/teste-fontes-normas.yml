name: Teste temporario fontes de normas
on:
  push:
    branches: [claude/project-thread-c0jh9y]
    paths: ['.github/workflows/teste-fontes-normas.yml']
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; SafetyNexo/1.0; acompanhamento de normas)"
          curl -sS -L -A "$UA" -o busca1.html -w "busca1 %{http_code} %{size_download}\n" --max-time 90 "https://www.in.gov.br/consulta/-/buscar/dou?q=%22Norma+Regulamentadora%22&s=do1&exactDate=ano&sortType=1&orgPrin=Minist%C3%A9rio+do+Trabalho+e+Emprego" || true
          curl -sS -L -A "$UA" -o dia.html -w "dia %{http_code} %{size_download}\n" --max-time 90 "https://www.in.gov.br/leiturajornal?data=27-08-2024&secao=do1" || true
          python3 - <<'PY'
          import re, json
          for f in ('busca1.html', 'dia.html'):
              h = open(f, encoding='utf-8', errors='ignore').read()
              m = re.search(r'<script[^>]+type="application/json"[^>]*>(.*?)</script>', h, re.S)
              arr = json.loads(m.group(1)).get('jsonArray', []) if m else []
              print('ARQ', f, len(arr), list(arr[0].keys()) if arr else '')
              for i in [x for x in arr if 'Trabalho' in x.get('hierarchyStr','')][:15]:
                  print('  ', i.get('pubDate'), '|', i.get('title'), '|', i.get('hierarchyStr'), '|', re.sub('<[^>]+>','',i.get('content',''))[:300])
              if f == 'busca1.html' and arr:
                  open('url.txt','w').write('https://www.in.gov.br/web/dou/-/' + arr[0]['urlTitle'])
          PY
          U=$(cat url.txt 2>/dev/null || echo "")
          if [ -n "$U" ]; then
            curl -sS -L -A "$UA" -o ato.html -w "ato %{http_code} %{size_download}\n" --max-time 90 "$U" || true
            python3 -c "
          h=open('ato.html',encoding='utf-8',errors='ignore').read(); k=h.find('texto-dou'); print('pos',k); print(h[max(k-300,0):k+3000])"
          fi
