name: Teste temporario fontes de normas
on:
  push:
    branches: [claude/project-thread-c0jh9y]
    paths: ['.github/workflows/teste-fontes-normas.yml', 'apps/api/src/normas/**']
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund >/dev/null
      - run: cd apps/api && npx prisma generate >/dev/null && npx tsc -p . --outDir /tmp/out
      - name: Ler o Diário Oficial de verdade (sem banco)
        run: |
          cat > /tmp/t.js <<'JS'
          const f = require('/tmp/out/normas/fontes.js');
          const m = require('/tmp/out/normas/monitor.js');
          (async () => {
            const atos = new Map();
            for (const termo of ['"Norma Regulamentadora"', '"Norma Regulamentadora" "Ministério do Trabalho e Emprego"', '"NR-" "Ministério do Trabalho e Emprego"']) {
              const url = `${f.DOU}/consulta/-/buscar/dou?q=${encodeURIComponent(termo)}&s=do1&exactDate=ano&sortType=1`;
              try { const l = f.lerBuscaDou((await f.baixar(url, 90000)).toString('utf-8')); console.log('busca', termo, l.length); l.forEach((a) => atos.set(a.url, a)); } catch (e) { console.log('ERRO busca', termo, e.message); }
            }
            const mud = [...atos.values()].filter(f.atoQueMudaNr);
            console.log('lidos', atos.size, 'mudam NR', mud.length);
            for (const ato of mud.slice(0, 12)) {
              let texto = '';
              try { const l = f.lerAtoDou((await f.baixar(ato.url, 60000)).toString('utf-8')); texto = l.texto; if (l.ementa) ato.ementa = l.ementa; } catch (e) { console.log('ERRO ato', e.message); }
              const normas = f.nrsCitadas(`${ato.titulo} ${ato.ementa} ${texto}`);
              const r = m.rascunhoSemIa(ato, texto, normas);
              console.log('\n==========', ato.chave, '| texto', texto.length, 'chars | mudaNr', f.atoQueMudaNr(ato));
              console.log(JSON.stringify({ ...r, resumo: undefined }, null, 1));
              console.log(r.resumo);
            }
          })();
          JS
          cd apps/api && NODE_PATH=$GITHUB_WORKSPACE/node_modules:$GITHUB_WORKSPACE/apps/api/node_modules node /tmp/t.js
