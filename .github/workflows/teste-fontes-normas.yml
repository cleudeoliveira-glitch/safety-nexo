name: Teste temporario fontes de normas
on:
  push:
    branches: [claude/project-thread-c0jh9y]
    paths: ['.github/workflows/teste-fontes-normas.yml']
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -L -A "Mozilla/5.0" -o busca.html --max-time 60 "https://www.in.gov.br/consulta/-/buscar/dou?q=%22Norma+Regulamentadora%22&s=do1&exactDate=ano&sortType=0&delta=50"
          python3 - <<'PY'
          import re, json, urllib.request
          h = open('busca.html', encoding='utf-8').read()
          m = re.search(r'BuscaDouPortlet_params"[^>]*>(.*?)</script>', h, re.S)
          d = json.loads(m.group(1))
          print('chaves', list(d.keys()))
          arr = d.get('jsonArray', [])
          print('itens', len(arr))
          for i in arr[:40]:
              print(json.dumps({k: i.get(k) for k in ('title','pubDate','artType','hierarchyStr','urlTitle','content')}, ensure_ascii=False)[:600])
          if arr:
              u = 'https://www.in.gov.br/web/dou/-/' + arr[0]['urlTitle']
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
              p = urllib.request.urlopen(req, timeout=60).read().decode('utf-8')
              k = p.find('texto-dou')
              print('PAGINA', u, len(p), k)
              print(p[k-200:k+3000])
          PY
