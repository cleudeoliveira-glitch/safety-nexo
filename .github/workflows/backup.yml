# Cópia de segurança dos dados, todo dia às 3h (Brasília).
#
# O que faz:
#  - copia o banco inteiro (pg_dump) e tranca a cópia com senha (AES-256) antes de sair daqui;
#  - guarda a cópia do dia por 90 dias aqui no GitHub (aba Actions > Backup > Artifacts);
#  - no dia 1º de cada mês, guarda também uma cópia mensal no Supabase, que não é apagada
#    (os documentos de SST precisam ficar guardados por até 20 anos);
#  - aos domingos, copia também os arquivos (logos, PDFs de ASO, fotos), trancados do mesmo jeito.
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#  - BACKUP_DATABASE_URL: endereço do banco do Supabase (Connect > Session pooler, porta 5432)
#  - BACKUP_SENHA: uma senha longa só para os backups. Guarde-a fora do sistema: sem ela,
#    ninguém abre a cópia, nem nós.
#  - SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY: os mesmos do servidor no Render
#
# Como restaurar: docs/backup.md
name: Backup

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SENHA: ${{ secrets.BACKUP_SENHA }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os segredos
        env:
          BANCO: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          [ -n "$BANCO" ] || { echo "Falta o segredo BACKUP_DATABASE_URL."; exit 1; }
          [ ${#SENHA} -ge 16 ] || { echo "Falta o segredo BACKUP_SENHA (mínimo 16 caracteres)."; exit 1; }

      - name: Instalar o cliente do Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Copiar o banco
        env:
          BANCO: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          DIA=$(TZ=America/Sao_Paulo date +%F)
          echo "DIA=$DIA" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$BANCO" --format=custom --no-owner --no-privileges --schema=public -f banco.dump
          ls -lh banco.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "banco-$DIA.dump.gpg" banco.dump <<< "$SENHA"
          rm banco.dump

      - name: Copiar os arquivos
        run: |
          if [ "$(TZ=America/Sao_Paulo date +%u)" != "7" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Arquivos só aos domingos."; exit 0
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Sem SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY: arquivos não copiados."; exit 0
          fi
          node scripts/backup-arquivos.mjs arquivos
          tar -czf arquivos.tar.gz arquivos && rm -rf arquivos
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "arquivos-$DIA.tar.gz.gpg" arquivos.tar.gz <<< "$SENHA"
          rm arquivos.tar.gz

      - name: Guardar a cópia do mês no Supabase
        run: |
          if [ "$(TZ=America/Sao_Paulo date +%d)" != "01" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Cópia mensal só no dia 1º."; exit 0
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Sem SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY: cópia mensal não guardada."; exit 0
          fi
          node scripts/backup-arquivos.mjs enviar "banco-$DIA.dump.gpg" "mensal/banco-$(TZ=America/Sao_Paulo date +%Y-%m).dump.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.DIA }}
          path: '*.gpg'
          retention-days: 90
          if-no-files-found: error
